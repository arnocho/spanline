version: 2

project_name: spanline

before:
  hooks:
    - go mod tidy

builds:
  - id: spanline
    main: ./cmd/spanline
    binary: spanline
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: spanline-airgap
    main: ./cmd/spanline
    binary: spanline
    env:
      - CGO_ENABLED=0
    tags:
      - airgap
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}-airgap
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: default
    ids: [spanline]
    formats: [tar.gz]
    files: [LICENSE, README.md, docs/security-review.md]
  - id: airgap
    ids: [spanline-airgap]
    name_template: "{{ .ProjectName }}_{{ .Version }}_airgap_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, README.md, docs/security-review.md]

sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  footer: |
    Read-only by construction. Nothing is installed in a cluster, no Secret is read.
    On a restricted site, build from source inside your own forge instead of using these archives.
