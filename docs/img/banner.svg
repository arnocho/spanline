<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="spanline: one read-only binary spanning Terraform and Kubernetes">
  <rect width="1200" height="320" rx="16" fill="#1e1e2e"/>
  <g font-family="Menlo, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
    <text x="64" y="112" font-size="64" font-weight="700" fill="#5EEAD4">spanline</text>
    <text x="64" y="158" font-size="22" fill="#cdd6f4">one read-only binary that spans your Terraform and your Kubernetes clusters, from your laptop</text>
    <text x="64" y="196" font-size="18" fill="#7f849c">no agent in the cluster  ·  no SaaS  ·  no Secret ever read  ·  works with no cluster at all</text>

    <g transform="translate(64,232)">
      <rect width="330" height="56" rx="8" fill="#282a3a" stroke="#45475a"/>
      <text x="18" y="24" font-size="15" fill="#5EEAD4">overview</text>
      <text x="18" y="44" font-size="13" fill="#a6adc8">where to look first, who owns each pool</text>
    </g>
    <g transform="translate(412,232)">
      <rect width="330" height="56" rx="8" fill="#282a3a" stroke="#45475a"/>
      <text x="18" y="24" font-size="15" fill="#FB923C">incident</text>
      <text x="18" y="44" font-size="13" fill="#a6adc8">what separates the failing pods, which change did it</text>
    </g>
    <g transform="translate(760,232)">
      <rect width="376" height="56" rx="8" fill="#282a3a" stroke="#45475a"/>
      <text x="18" y="24" font-size="15" fill="#F87171">impact</text>
      <text x="18" y="44" font-size="13" fill="#a6adc8">what breaks if these nodes go away, or this plan runs</text>
    </g>

    <g transform="translate(1036,60)" fill="#45475a">
      <rect x="0" y="0" width="100" height="6" rx="3" fill="#5EEAD4"/>
      <rect x="0" y="16" width="72" height="6" rx="3"/>
      <rect x="0" y="32" width="88" height="6" rx="3"/>
      <rect x="0" y="48" width="56" height="6" rx="3" fill="#F87171"/>
      <rect x="0" y="64" width="80" height="6" rx="3"/>
      <rect x="0" y="80" width="64" height="6" rx="3" fill="#FCD34D"/>
    </g>
  </g>
</svg>
